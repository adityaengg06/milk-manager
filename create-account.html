<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Milk Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <main class="main-content">


        <div class="login-container">


            <div class="login-logo">

                🥛

            </div>


            <h1>
                Create Account
            </h1>


            <p class="login-subtitle">
                Set up your Milk Manager account
            </p>


            <form
                id="createAccountForm"
            >


                <div class="form-group">

                    <label>
                        Owner / Distributor Name
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Business Name
                    </label>

                    <input
                        type="text"
                        id="businessName"
                        placeholder="Enter business name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="accountMobile"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="accountPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    CREATE ACCOUNT
                </button>


            </form>


            <div class="login-footer">

                <span>
                    Already have an account?
                </span>


                <a
                    href="index.html"
                >
                    Login
                </a>

            </div>


        </div>


    </main>


</div>


<script src="app.js"></script>

</body>

</html>
