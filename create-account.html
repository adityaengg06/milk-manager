<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Milk Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <header class="simple-header">

        <div>

            <h1>
                Create Account
            </h1>

            <p>
                Set up your Milk Manager account
            </p>

        </div>

    </header>


    <main class="main-content">


        <div class="profile-card">

            <div class="big-avatar">
                🥛
            </div>

            <div>

                <strong>
                    Milk Manager
                </strong>

                <small>
                    Create your account
                </small>

            </div>

        </div>


        <form id="createAccountForm">


            <label>
                Owner / Distributor Name
            </label>

            <input
                type="text"
                id="ownerName"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >


            <label>
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                placeholder="Enter business name"
                autocomplete="organization"
                required
            >


            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="accountMobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="accountPassword"
                placeholder="Minimum 6 characters"
                autocomplete="new-password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                autocomplete="new-password"
                required
            >


            <button
                type="submit"
                class="login-btn"
            >
                CREATE ACCOUNT
            </button>


        </form>


        <div class="create-account-link">

            <span>
                Already have an account?
            </span>

            <button
                type="button"
                onclick="goTo('index.html')"
            >
                Login
            </button>

        </div>


    </main>


</div>


<!-- APP JAVASCRIPT -->

<script src="app.js"></script>


</body>

</html>
