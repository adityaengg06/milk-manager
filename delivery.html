<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daily Delivery - Milk Manager</title>

    <!-- AUTHENTICATION -->
    <script src="auth.js"></script>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="simple-header">

        <div>

            <h1>
                Daily Delivery
            </h1>

            <p id="deliveryDate">
                Loading date...
            </p>

        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="main-content">


        <!-- =================================================
             PROGRESS
        ================================================== -->

        <section class="delivery-progress-card">

            <div class="delivery-progress-top">

                <strong>
                    Today's Delivery
                </strong>

                <span id="deliveryPercent">
                    0%
                </span>

            </div>


            <div class="delivery-progress-bar">

                <div
                    id="deliveryProgressBar"
                    class="delivery-progress-fill"
                    style="width: 0%;"
                ></div>

            </div>


            <p id="deliveryProgressText">
                0 / 0 Completed
            </p>

        </section>



        <!-- =================================================
             CUSTOMER AREA
        ================================================== -->

        <section id="customerArea">


            <!-- CUSTOMER CARD -->

            <div class="customer-card delivery-customer-card">


                <div class="customer-avatar">

                    <div
                        id="customerAvatar"
                        class="big-avatar"
                    >
                        C
                    </div>

                </div>


                <div class="customer-info">

                    <strong id="customerName">
                        Customer
                    </strong>


                    <small id="customerPhone">
                        📞 -
                    </small>


                    <small id="customerAddress">
                        Address not available
                    </small>

                </div>

            </div>



            <!-- =================================================
                 MILK
            ================================================== -->

            <div class="delivery-product-card">

                <div class="product-title">

                    <span>
                        🥛
                    </span>

                    <strong>
                        Milk
                    </strong>

                </div>


                <div class="quantity-control">

                    <button
                        type="button"
                        id="milkMinus"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        id="milkQuantity"
                        value="0"
                        min="0"
                        step="0.5"
                    >


                    <span>
                        L
                    </span>


                    <button
                        type="button"
                        id="milkPlus"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- =================================================
                 PANEER
            ================================================== -->

            <div class="delivery-product-card">

                <div class="product-title">

                    <span>
                        🧀
                    </span>

                    <strong>
                        Paneer
                    </strong>

                </div>


                <div class="quantity-control">

                    <button
                        type="button"
                        id="paneerMinus"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        id="paneerQuantity"
                        value="0"
                        min="0"
                        step="0.5"
                    >


                    <span>
                        kg
                    </span>


                    <button
                        type="button"
                        id="paneerPlus"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- =================================================
                 CURD
            ================================================== -->

            <div class="delivery-product-card">

                <div class="product-title">

                    <span>
                        🥣
                    </span>

                    <strong>
                        Curd
                    </strong>

                </div>


                <div class="quantity-control">

                    <button
                        type="button"
                        id="curdMinus"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        id="curdQuantity"
                        value="0"
                        min="0"
                        step="0.5"
                    >


                    <span>
                        kg
                    </span>


                    <button
                        type="button"
                        id="curdPlus"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- =================================================
                 GHEE
            ================================================== -->

            <div class="delivery-product-card">

                <div class="product-title">

                    <span>
                        🫙
                    </span>

                    <strong>
                        Ghee
                    </strong>

                </div>


                <div class="quantity-control">

                    <button
                        type="button"
                        id="gheeMinus"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        id="gheeQuantity"
                        value="0"
                        min="0"
                        step="0.5"
                    >


                    <span>
                        kg
                    </span>


                    <button
                        type="button"
                        id="gheePlus"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- =================================================
                 ACTION BUTTONS
            ================================================== -->

            <div class="delivery-actions">


                <button
                    type="button"
                    id="deliveredBtn"
                    class="primary-btn"
                >
                    ✓ Delivered
                </button>


                <button
                    type="button"
                    id="notDeliveredBtn"
                    class="secondary-btn"
                >
                    ✕ Not Delivered
                </button>


            </div>



            <!-- =================================================
                 PREVIOUS
            ================================================== -->

            <button
                type="button"
                id="previousBtn"
                class="back-btn"
            >
                ← Previous Customer
            </button>


        </section>



        <!-- =====================================================
             COMPLETION AREA
        ====================================================== -->

        <section
            id="completionArea"
            style="display: none;"
        >

            <div class="completion-card">

                <div class="completion-icon">
                    ✓
                </div>


                <h2>
                    Today's Delivery Complete
                </h2>


                <p>
                    All customers have been processed.
                </p>


                <div id="completionStats">

                    0 / 0 Completed

                </div>


                <div class="completion-actions">

                    <button
                        type="button"
                        id="viewReportBtn"
                        class="primary-btn"
                    >
                        📊 View Daily Report
                    </button>


                    <button
                        type="button"
                        id="backToHomeBtn"
                        class="secondary-btn"
                    >
                        ← Back to Home
                    </button>

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-item"
            type="button"
            onclick="goTo('home.html')"
        >

            <span>
                🏠
            </span>

            <small>
                Home
            </small>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="goTo('customers.html')"
        >

            <span>
                👥
            </span>

            <small>
                Customers
            </small>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="goTo('reports.html')"
        >

            <span>
                🥛
            </span>

            <small>
                Report
            </small>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="goTo('bills.html')"
        >

            <span>
                🧾
            </span>

            <small>
                Bills
            </small>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="goTo('settings.html')"
        >

            <span>
                ⚙️
            </span>

            <small>
                More
            </small>

        </button>


    </nav>


</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="app.js"></script>

<script src="database.js"></script>

<script src="delivery.js"></script>


</body>

</html>
