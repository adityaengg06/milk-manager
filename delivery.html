<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Milk Manager - Delivery</title>

    <script src="auth.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="page-container delivery-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="page-header">

        <div>

            <h1>🥛 Delivery</h1>

            <p id="deliveryDateText">
                Loading date...
            </p>

        </div>

    </div>



    <!-- =====================================================
         DATE SELECTOR
    ====================================================== -->

    <div
        style="
            background:#ffffff;
            padding:16px;
            margin:15px 0;
            border-radius:12px;
            border:1px solid #dddddd;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        "
    >

        <label
            for="deliveryDatePicker"
            style="
                display:block;
                font-weight:600;
                margin-bottom:8px;
                font-size:15px;
                color:#222222;
            "
        >
            📅 Select Delivery Date
        </label>


        <div
            style="
                display:flex;
                gap:10px;
                align-items:center;
                width:100%;
            "
        >

            <input
                type="date"
                id="deliveryDatePicker"
                style="
                    flex:1;
                    min-height:46px;
                    padding:8px 10px;
                    border:1px solid #bbbbbb;
                    border-radius:8px;
                    background:#ffffff;
                    color:#222222;
                    font-size:16px;
                    box-sizing:border-box;
                    min-width:0;
                "
            >


            <button
                type="button"
                id="todayBtn"
                style="
                    min-height:46px;
                    padding:8px 14px;
                    border:none;
                    border-radius:8px;
                    background:#222222;
                    color:#ffffff;
                    font-size:14px;
                    font-weight:600;
                    cursor:pointer;
                    white-space:nowrap;
                "
            >
                Today
            </button>

        </div>


        <p
            style="
                margin:10px 0 0;
                font-size:13px;
                color:#666666;
            "
        >
            Select the date for which you want to manage deliveries.
        </p>

    </div>



    <!-- =====================================================
         PROGRESS
    ====================================================== -->

    <div class="delivery-progress-box">

        <div class="delivery-progress-top">

            <strong id="deliveryProgressText">
                0 / 0 Completed
            </strong>

            <span id="deliveryPercent">
                0%
            </span>

        </div>


        <div class="delivery-progress">

            <div
                id="deliveryProgressBar"
                class="delivery-progress-bar"
            ></div>

        </div>

    </div>



    <!-- =====================================================
         CUSTOMER AREA
    ====================================================== -->

    <div
        id="customerArea"
        class="delivery-customer-area"
    >

        <div class="delivery-customer-card">


            <!-- CUSTOMER HEADER -->

            <div class="delivery-customer-header">

                <div
                    id="customerAvatar"
                    class="delivery-avatar"
                >
                    C
                </div>


                <div>

                    <h2 id="customerName">
                        Customer Name
                    </h2>

                    <p id="customerPhone">
                        📞 -
                    </p>

                </div>

            </div>



            <!-- ADDRESS -->

            <div class="delivery-address">

                📍

                <span id="customerAddress">
                    Customer Address
                </span>

            </div>



            <!-- =================================================
                 MILK
            ================================================== -->

            <div class="delivery-product-box">

                <div>

                    <span class="delivery-product-title">
                        🥛 Milk
                    </span>

                    <small>
                        Delivery quantity
                    </small>

                </div>


                <div class="quantity-control">

                    <button
                        id="milkMinus"
                        type="button"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        id="milkQuantity"
                        min="0"
                        step="0.5"
                        value="0"
                    >


                    <span>
                        L
                    </span>


                    <button
                        id="milkPlus"
                        type="button"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- =================================================
                 EXTRA PRODUCTS
            ================================================== -->

            <div class="delivery-extra-products">

                <h3>
                    Extra Products
                </h3>


                <!-- PANEER -->

                <div class="extra-product-row">

                    <label>
                        🧀 Paneer
                    </label>


                    <div class="small-quantity">

                        <button
                            type="button"
                            id="paneerMinus"
                        >
                            −
                        </button>


                        <input
                            type="number"
                            id="paneerQuantity"
                            min="0"
                            step="0.5"
                            value="0"
                        >


                        <span>
                            kg
                        </span>


                        <button
                            type="button"
                            id="paneerPlus"
                        >
                            +
                        </button>

                    </div>

                </div>



                <!-- CURD -->

                <div class="extra-product-row">

                    <label>
                        🥣 Curd
                    </label>


                    <div class="small-quantity">

                        <button
                            type="button"
                            id="curdMinus"
                        >
                            −
                        </button>


                        <input
                            type="number"
                            id="curdQuantity"
                            min="0"
                            step="0.5"
                            value="0"
                        >


                        <span>
                            kg
                        </span>


                        <button
                            type="button"
                            id="curdPlus"
                        >
                            +
                        </button>

                    </div>

                </div>



                <!-- GHEE -->

                <div class="extra-product-row">

                    <label>
                        🧈 Ghee
                    </label>


                    <div class="small-quantity">

                        <button
                            type="button"
                            id="gheeMinus"
                        >
                            −
                        </button>


                        <input
                            type="number"
                            id="gheeQuantity"
                            min="0"
                            step="0.5"
                            value="0"
                        >


                        <span>
                            kg
                        </span>


                        <button
                            type="button"
                            id="gheePlus"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 ACTION BUTTONS
            ================================================== -->

            <div class="delivery-actions">

                <button
                    id="notDeliveredBtn"
                    class="delivery-skip-btn"
                    type="button"
                >
                    ✕ Not Delivered
                </button>


                <button
                    id="deliveredBtn"
                    class="delivery-done-btn"
                    type="button"
                >
                    ✓ Mark Delivered
                </button>

            </div>



            <!-- PREVIOUS CUSTOMER -->

            <button
                id="previousBtn"
                class="delivery-previous-btn"
                type="button"
            >
                ← Previous Customer
            </button>


        </div>

    </div>



    <!-- =====================================================
         COMPLETION AREA
    ====================================================== -->

    <div
        id="completionArea"
        class="delivery-complete"
        style="display:none;"
    >

        <div class="completion-icon">
            🎉
        </div>


        <h2>
            Delivery Completed
        </h2>


        <p id="completionDateText">
            All customers have been processed.
        </p>


        <div
            id="completionStats"
            class="completion-stats"
        >
            0 / 0 Customers
        </div>


        <div class="completion-actions">

            <button
                id="backToHomeBtn"
                class="primary-btn"
                type="button"
            >
                🏠 Back to Home
            </button>


            <button
                id="viewReportBtn"
                class="secondary-btn"
                type="button"
            >
                📊 View Report
            </button>

        </div>

    </div>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="database.js"></script>

<script src="delivery.js"></script>


</body>

</html>
