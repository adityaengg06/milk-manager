<!DOCTYPE html>
<html lang="en">

<head>

    <meta
        name="viewport"

    <link rel="stylesheet" href="style.css">

<body>

<div class="app">


<header class="simple-header">

    <div>

            Daily Report

    </div>

</header>


<main class="main-content">

    <span>

    <p>
        76 of 82 customers delivered

</div>



<div class="report-grid">


<div>

    <span>✅</span>

    <strong>
        76
    </strong>

    <small>
        Delivered
    </small>

</div>



<div>

    <span>⏳</span>

    <strong>
        6
    </strong>

    <small>
        Remaining
    </small>

</div>



<div>

    <span>🥛</span>

    <strong>
        154 L
    </strong>

    <small>
        Milk
    </small>

</div>

</div>



<div class="report-list">

    <div>
        <span>
            Total Customers
        </span>

        <strong>
            82
        </strong>
    </div>


    <div>
        <span>
            Delivered
        </span>

        <strong>
            76
        </strong>
    </div>


    <div>
        <span>
            Pending
        </span>

        <strong>
            6
        </strong>
    </div>


    <div>
        <span>
            Milk Delivered
        </span>

        <strong>
            154 L
        </strong>
    </div>


    <div>
        <span>
            Collection
        </span>

        <strong>
            ₹8,450
        </strong>
    </div>

</div>

    </button>

    </button>

    <button class="nav-item" onclick="goTo('bills.html')">

    </button>

    <button class="nav-item" onclick="goTo('settings.html')">
