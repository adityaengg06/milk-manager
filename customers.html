<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Milk Manager</title> 
    <script src="auth.js"> </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <div class="page-header">

        <div>
            <h1>Customers</h1>
            <p>Manage your milk customers</p>
        </div>

        <button class="primary-btn" id="addCustomerBtn">
            + Add Customer
        </button>

    </div>


    <!-- SEARCH -->
    <div class="search-box">

        <input
            type="text"
            id="customerSearch"
            placeholder="🔍 Search customer..."
            autocomplete="off"
        >

    </div>


    <!-- CUSTOMER COUNT -->
    <div class="section-title">

        <h2>All Customers</h2>

        <span id="customerCount">0 Customers</span>

    </div>


    <!-- CUSTOMER LIST -->
    <div id="customerList" class="customer-list">

        <!-- Customers will appear here -->

    </div>

</div>


<!-- ================================================= -->
<!-- ADD CUSTOMER MODAL -->
<!-- ================================================= -->

<div id="customerModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <div>
                <h2>Add Customer</h2>
                <p>Enter customer details</p>
            </div>

            <button
                type="button"
                class="close-btn"
                id="closeCustomerModal"
            >
                ×
            </button>

        </div>


        <!-- FORM -->

        <form id="customerForm">

            <div class="form-group">

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="customerMobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="customerMobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required
                >

            </div>


            <div class="form-group">

                <label for="customerAddress">
                    Address
                </label>

                <input
                    type="text"
                    id="customerAddress"
                    placeholder="House No, Street / Sector"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="milkQuantity">
                        Daily Milk
                    </label>

                    <input
                        type="number"
                        id="milkQuantity"
                        placeholder="2"
                        min="0"
                        step="0.5"
                        value="2"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="milkRate">
                        Rate / Litre
                    </label>

                    <input
                        type="number"
                        id="milkRate"
                        placeholder="60"
                        min="0"
                        value="60"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="customerStatus">
                    Status
                </label>

                <select id="customerStatus">

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelCustomerBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Customer
                </button>

            </div>

        </form>

    </div>

</div>


<script src="database.js"></script>
<script src="customers.js"></script>

</body>
</html>
